syntax = "proto3";

package sage.ipc.v2;

// The protocol version is also carried in every frame. Breaking changes use a
// new package and version; additive changes retain unknown fields.

enum ClientKind {
  CLIENT_KIND_UNSPECIFIED = 0;
  CLIENT_KIND_MACOS = 1;
  CLIENT_KIND_WINDOWS = 2;
  CLIENT_KIND_DIAGNOSTIC = 3;
  CLIENT_KIND_BROWSER = 4;
}

enum InputSource {
  INPUT_SOURCE_UNSPECIFIED = 0;
  INPUT_SOURCE_TYPED = 1;
  INPUT_SOURCE_VOICE = 2;
  INPUT_SOURCE_SHORTCUT = 3;
  INPUT_SOURCE_AUTOMATION = 4;
}

enum ApprovalDecision {
  APPROVAL_DECISION_UNSPECIFIED = 0;
  APPROVAL_DECISION_APPROVE_ONCE = 1;
  APPROVAL_DECISION_DENY = 2;
}

enum RiskLevel {
  RISK_LEVEL_UNSPECIFIED = 0;
  RISK_LEVEL_SAFE = 1;
  RISK_LEVEL_SENSITIVE = 2;
  RISK_LEVEL_CONSEQUENTIAL = 3;
  RISK_LEVEL_DESTRUCTIVE = 4;
  RISK_LEVEL_PRIVILEGED = 5;
  RISK_LEVEL_PROHIBITED = 6;
}

enum TaskStatus {
  TASK_STATUS_UNSPECIFIED = 0;
  TASK_STATUS_PENDING = 1;
  TASK_STATUS_PLANNING = 2;
  TASK_STATUS_RUNNING = 3;
  TASK_STATUS_WAITING_FOR_APPROVAL = 4;
  TASK_STATUS_WAITING_FOR_USER = 5;
  TASK_STATUS_PAUSED = 6;
  TASK_STATUS_SUCCEEDED = 7;
  TASK_STATUS_FAILED = 8;
  TASK_STATUS_CANCELLED = 9;
  TASK_STATUS_INTERRUPTED = 10;
  TASK_STATUS_ANSWERED = 11;
  TASK_STATUS_PARTIAL = 12;
}

message Frame {
  uint32 protocol_version = 1;
  uint64 sequence = 2;
  oneof payload {
    ServerChallenge server_challenge = 10;
    ClientAuthenticate client_authenticate = 11;
    AuthenticationResult authentication_result = 12;
    UiCommand ui_command = 13;
    CoreEvent core_event = 14;
    Ping ping = 15;
    Pong pong = 16;
    AdapterHello adapter_hello = 17;
    AdapterRequest adapter_request = 18;
    AdapterResult adapter_result = 19;
    AdapterCancel adapter_cancel = 20;
    AdapterCancelAcknowledged adapter_cancel_acknowledged = 21;
  }
}

message ServerChallenge {
  bytes nonce = 1;
  uint32 minimum_protocol_version = 2;
  uint32 maximum_protocol_version = 3;
  string core_instance_id = 4;
  repeated string supported_features = 5;
}

message ClientAuthenticate {
  ClientKind client_kind = 1;
  string client_version = 2;
  bytes client_nonce = 3;
  bytes proof = 4;
  repeated string supported_features = 5;
}

message AuthenticationResult {
  bool accepted = 1;
  string session_id = 2;
  string error_code = 3;
  string message = 4;
  bytes server_proof = 5;
  repeated string negotiated_features = 6;
}

message UiCommand {
  string request_id = 1;
  oneof command {
    SubmitTask submit_task = 10;
    ControlTask control_task = 11;
    ApprovalResponse approval_response = 12;
    GetState get_state = 13;
    UpdatePermission update_permission = 14;
    UndoLastAction undo_last_action = 15;
    UserAnswer user_answer = 16;
    SaveProviderSettings save_provider_settings = 17;
    TestProviderConnection test_provider_connection = 18;
    KnowledgeCommand knowledge_command = 19;
    WorkflowCommand workflow_command = 20;
    UnlockStorage unlock_storage = 21;
    UpdateIntent update_intent = 22;
    WorldModelCommand world_model_command = 23;
  }
}

message UnlockStorage {}

// Ephemeral native input, never a submission or an execution capability.
// Monotonic revisions are scoped to the authenticated IPC connection.
message UpdateIntent {
  string stream_id = 1;
  uint64 revision = 2;
  string text = 3;
  string active_task_id = 4;
  bool allow_interrupt = 5;
  repeated string folder_roots = 6;
  bool voice_input = 7;
}

message IntentPreview {
  string stream_id = 1;
  uint64 revision = 2;
  repeated string steps = 3;
  bool compiled_locally = 4;
  string status = 5;
  string detail = 6;
  uint64 compile_micros = 7;
  // A single complete, locally compiled macOS app step whose explicit
  // "and then" boundary is still followed by unfinished speech. The UI may
  // submit only this exact prefix through the ordinary approval path.
  string streamed_prefix = 8;
  // Reviewed routine aliases suggested from a fresh, explicit local
  // reference. Choosing one fills the composer; it never submits a task.
  repeated string routine_suggestions = 9;
  string routine_suggestion_detail = 10;
}

message SubmitTask {
  string text = 1;
  InputSource source = 2;
  string conversation_id = 3;
  repeated ResourceScope resources = 4;
  // Explicit replacement of this conversation's current request. A new run
  // obtains fresh authority; stopping an old run does not undo its effects.
  string supersedes_task_id = 5;
  // Non-empty only for a prepared voice prefix. The final voice request must
  // carry the same stream id and finalize_stream=true to revise the same run.
  string voice_stream_id = 6;
  bool streamed_prefix = 7;
  bool finalize_stream = 8;
}

message ControlTask {
  enum Operation {
    OPERATION_UNSPECIFIED = 0;
    OPERATION_PAUSE = 1;
    OPERATION_RESUME = 2;
    OPERATION_CANCEL = 3;
  }
  string task_id = 1;
  Operation operation = 2;
}

message ApprovalResponse {
  string task_id = 1;
  string action_id = 2;
  string approval_id = 3;
  string approval_digest = 4;
  ApprovalDecision decision = 5;
  bool native_authentication_satisfied = 6;
}

message GetState {
  bool include_completed_tasks = 1;
}

message UpdatePermission {
  string permission = 1;
  bool granted = 2;
}

message UndoLastAction {
  string task_id = 1;
  // Required identity from TaskUpdate; retries must not select an older action.
  string action_id = 2;
}

message UserAnswer {
  string task_id = 1;
  string action_id = 2;
  string question_id = 3;
  string answer = 4;
}

// Deprecated v2 compatibility payload. Sage rejects configuration changes and
// does not persist provider endpoints or credentials.
message SaveProviderSettings {
  string role = 1;
  string provider = 2;
  string model = 3;
  string endpoint = 4;
  string api_key = 5;
  bool remove_saved_key = 6;
  bool native_authentication_satisfied = 7;
}

// Deprecated v2 compatibility payload. Sage never performs provider probes.
message TestProviderConnection {
  string role = 1;
  string provider = 2;
  string model = 3;
  string endpoint = 4;
  string api_key = 5;
}

message CoreEvent {
  string event_id = 1;
  int64 occurred_at_unix_ms = 2;
  oneof event {
    StateSnapshot state_snapshot = 10;
    TaskUpdate task_update = 11;
    AgentEvent agent_event = 12;
    ApprovalRequest approval_request = 13;
    ModelResponseDelta model_response_delta = 14;
    ErrorEvent error = 15;
    NotificationEvent notification = 16;
    PermissionRequest permission_request = 17;
    QuestionRequest question_request = 18;
    ProviderConnectionResult provider_connection_result = 19;
    KnowledgeState knowledge_state = 20;
    WorkflowState workflow_state = 21;
    TaskAccepted task_accepted = 22;
    DecisionResolved decision_resolved = 23;
    IntentPreview intent_preview = 24;
    WorldModelState world_model_state = 25;
  }
}

// Sent only after the command and task have committed durably. Retrying the
// same request identity and content returns the same task, including after restart.
message TaskAccepted {
  string request_id = 1;
  string task_id = 2;
}

message DecisionResolved {
  string decision_id = 1;
  string task_id = 2;
  string state = 3;
}

message ProviderConnectionResult {
  string request_id = 1;
  bool success = 2;
  string provider = 3;
  string model = 4;
  string message = 5;
}

message StateSnapshot {
  repeated TaskUpdate tasks = 1;
  repeated ApprovalRequest pending_approvals = 2;
  string core_version = 3;
  uint32 protocol_version = 4;
  repeated ProviderSettings provider_settings = 5;
  KnowledgeState knowledge = 6;
  bool storage_locked = 7;
  repeated QuestionRequest pending_questions = 8;
}

// Deprecated v2 compatibility snapshot field. Sage always returns it empty.
message ProviderSettings {
  string role = 1;
  string provider = 2;
  string model = 3;
  string endpoint = 4;
  bool has_api_key = 5;
}

message TaskUpdate {
  string task_id = 1;
  string request = 2;
  TaskStatus status = 3;
  string summary = 4;
  uint32 completed_actions = 5;
  uint32 total_actions = 6;
  string current_action = 7;
  string final_outcome = 8;
  bool undo_available = 9;
  string conversation_id = 10;
  string message_id = 11;
  repeated ActionProgress actions = 12;
  ExecutionFacts execution_facts = 13;
  // Stop addresses this stable scope across fresh continuation executions.
  string control_scope_id = 14;
  string continued_task_id = 15;
  // Durable compensation state: empty, prepared, dispatched, uncertain, verified.
  string undo_state = 16;
  string undo_summary = 17;
  string undo_action_id = 18;
  uint64 intent_revision = 19;
  string intent_change_summary = 20;
  string routine_summary = 21;
}

// Broker-derived execution evidence; model text cannot assign these counts.
message ExecutionFacts {
  uint32 verified = 1;
  uint32 failed = 2;
  uint32 pending = 3;
  uint32 uncertain = 4;
  string summary = 5;
  uint32 undone = 6;
}

// Additive typed operations; JSON records are schema-validated by sage-core.
message KnowledgeCommand {
  string operation = 1; // list, remember, edit, delete, enable, disable, configure, conversation
  string id = 2;
  string content = 3;
  bool enabled = 4;
  string conversation_id = 5;
  bool pinned = 6;
  bool archived = 7;
}
message KnowledgeState { string json = 1; }
message WorkflowCommand {
  string operation = 1; // list, capture_skill, run_skill, save_workflow, run_workflow, save_schedule, delete_*
  string id = 2;
  string name = 3;
  string json = 4;
  string conversation_id = 5;
  repeated ResourceScope background_resources = 6;
  int64 background_expires_at_unix_ms = 7;
  uint32 maximum_runs = 8;
}
message WorkflowState { string json = 1; }
// Descriptive discovery data and explicitly approved, expiring learning
// sessions. JSON payloads are decoded into closed Rust schemas by sage-core.
message WorldModelCommand {
  string operation = 1; // discover_current_application, discover_paired_browser, discover_upnp_media_renderers, observe_upnp_transport, observe_upnp_protocol_info, list, system, synthesize_goal, run_goal, run_stream_procedure, run_file_stream_copy, compile_controller_draft, get_controller_draft, review_controller_draft, forget_system, approve_learning_session, run_learning_probe, stop_learning_session
  string id = 2;
  string json = 3;
  UpnpRendererObservationTarget upnp_renderer_observation_target = 4;
}
// Exact passive-discovery identity used to request fresh, read-only device
// observations. It carries no network endpoint, pairing state or grant.
message UpnpRendererObservationTarget {
  string unique_device_name = 1;
  string description_sha256 = 2;
}
message WorldModelState { string json = 1; }
message ActionProgress { string action_id = 1; string summary = 2; string status = 3; }
message AdapterHello { string domain = 1; uint32 cancellation_protocol = 2; }

// Receipt of this signal does not prove that an external effect was prevented.
// A final AdapterResult must still be retained and reconciled by the broker.
message AdapterCancel { string request_id = 1; int64 expires_at_unix_ms = 2; }
message AdapterCancelAcknowledged { string request_id = 1; }
message AdapterRequest { string request_id = 1; string operation = 2; string json = 3; int64 expires_at_unix_ms = 4; ExecutionGrant grant = 5; BrowserTarget browser_target = 6; ApplicationTarget application_target = 7; }
message ApplicationTarget {
  string platform = 1;
  string bundle_path = 2;
  string identifier = 3;
  string code_digest = 4;
  string signer = 5;
  repeated string code_digests = 6; // Sorted validated code-directory identities, one per binary architecture.
}
message BrowserTarget {
  int32 tab_id = 1;
  int32 window_id = 2;
  int32 frame_id = 3;
  string document_id = 4;
  uint64 navigation_generation = 5;
  string origin = 6;
  string url = 7;
}
message AdapterResult { string request_id = 1; bool success = 2; string json = 3; string error = 4; ApplicationTarget application_target = 5; uint32 observed_process_id = 6; }

message AgentEvent {
  string task_id = 1;
  string action_id = 2;
  string kind = 3;
  string title = 4;
  string detail = 5;
  RiskLevel risk = 6;
}

message ApprovalRequest {
  string approval_id = 1;
  string approval_digest = 2;
  string task_id = 3;
  string action_id = 4;
  string title = 5;
  string explanation = 6;
  string resource = 7;
  RiskLevel risk = 8;
  int64 expires_at_unix_ms = 9;
  bool reversible = 10;
  bool requires_native_authentication = 11;
}

message ModelResponseDelta {
  string task_id = 1;
  string text = 2;
  bool finished = 3;
}

message ErrorEvent {
  string request_id = 1;
  string task_id = 2;
  string code = 3;
  string message = 4;
  bool recoverable = 5;
}

message NotificationEvent {
  string title = 1;
  string body = 2;
  string task_id = 3;
}

message PermissionRequest {
  string permission = 1;
  string reason = 2;
  string task_id = 3;
  string action_id = 4;
}

message QuestionRequest {
  string question_id = 1;
  string task_id = 2;
  string action_id = 3;
  string question = 4;
  int64 expires_at_unix_ms = 5;
}

message Ping {
  uint64 value = 1;
}

message Pong {
  uint64 value = 1;
}

// Only native UI submissions may establish these scopes. The broker resolves
// every root and limits the lifetime; models never receive a scope-setting API.
enum ResourceEffect {
  RESOURCE_EFFECT_UNSPECIFIED = 0;
  RESOURCE_EFFECT_READ = 1;
  RESOURCE_EFFECT_CREATE = 2;
}
message ResourceScope {
  string root = 1;
  repeated ResourceEffect effects = 2;
}
message ExecutionGrant {
  string grant_id = 1;
  string run_id = 2;
  string action_id = 3;
  string action_digest = 4;
  uint32 policy_version = 5;
  string worker_session = 6;
  int64 expires_at_unix_ms = 7;
  string domain = 8;
  repeated string operations = 9;
  oneof resource {
    string file = 10;
    FilePair file_pair = 11;
    string application = 12;
    string browser_origin = 13;
    bool user_interaction = 14;
  }
}
message FilePair { string source = 1; string destination = 2; }
