name: Native architecture CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  macos:
    strategy:
      matrix:
        include:
          - runner: macos-15
            architecture: arm64
          - runner: macos-15-intel
            architecture: x86_64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@b4f984c1e7daae8e175614de3e73a8411a20333c # 1.89.0
        with:
          components: rustfmt, clippy

      - name: Install protobuf compiler
        run: brew install protobuf

      - name: Check Rust formatting
        run: cargo fmt --all -- --check

      - name: Lint Rust workspace
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Test Rust workspace
        run: cargo test --workspace --locked -- --test-threads=4

      - name: Test opt-in Qwen evaluation stack
        run: cargo test -p sage-core --all-targets --features qwen35-evaluation --locked -- --test-threads=4

      - name: Verify inference worker App Sandbox
        run: python3 scripts/test-inference-worker-sandbox.py

      - name: Lint inference worker sandbox probe
        run: cargo clippy -p sage-inference-worker --all-targets --features sandbox-probe --locked -- -D warnings

      - name: Test browser contracts and release gates
        run: |
          node --test integrations/browser/background.test.mjs
          python3 -m unittest discover -s scripts -p 'test_*.py'
          python3 scripts/check-v2-release.py

      - name: Build and test native macOS client
        run: swift test --package-path apps/macos

      - name: Test native transport and cancellation control
        run: sh scripts/test-native-control.sh

      - name: Check architecture and credentials
        run: ./scripts/check-repository.sh

  windows:
    runs-on: windows-2025
    timeout-minutes: 40
    strategy:
      matrix:
        platform: [x64]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@b4f984c1e7daae8e175614de3e73a8411a20333c # 1.89.0
        with:
          components: clippy

      - name: Install .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 8.0.x

      - name: Install protobuf compiler
        shell: powershell
        run: choco install protoc --no-progress -y

      - name: Configure libclang for SQLCipher hooks
        shell: pwsh
        run: |
          $sageLibclang = Join-Path ${env:ProgramFiles} 'LLVM\bin'
          if (-not (Test-Path (Join-Path $sageLibclang 'libclang.dll'))) { throw 'LLVM libclang is required for SQLCipher pre-update bindings.' }
          "LIBCLANG_PATH=$sageLibclang" >> $env:GITHUB_ENV

      - name: Check Rust workspace
        run: cargo check --workspace --all-targets --locked

      - name: Test Rust workspace
        run: cargo test --workspace --locked -- --test-threads=4

      - name: Test opt-in Qwen evaluation stack
        run: cargo test -p sage-core --all-targets --features qwen35-evaluation --locked -- --test-threads=4

      - name: Build WinUI client
        run: dotnet build apps/windows/Sage.Windows/Sage.Windows.csproj -c Release -p:Platform=${{ matrix.platform }}
