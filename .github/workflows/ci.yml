name: Native architecture CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  macos:
    strategy:
      matrix:
        include:
          - runner: macos-15
            architecture: arm64
          - runner: macos-15-intel
            architecture: x86_64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@b4f984c1e7daae8e175614de3e73a8411a20333c # 1.89.0
        with:
          components: rustfmt, clippy

      - name: Install protobuf compiler
        run: brew install protobuf

      - name: Check Rust formatting
        run: cargo fmt --all -- --check

      - name: Lint Rust workspace
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Test Rust workspace
        run: cargo test --workspace --locked

      - name: Build native macOS client
        run: swift build --package-path apps/macos

      - name: Check architecture and credentials
        run: ./scripts/check-repository.sh

  windows:
    runs-on: windows-2025
    timeout-minutes: 40
    strategy:
      matrix:
        platform: [x64]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@b4f984c1e7daae8e175614de3e73a8411a20333c # 1.89.0
        with:
          components: clippy

      - name: Install .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 8.0.x

      - name: Install protobuf compiler
        shell: powershell
        run: choco install protoc --no-progress -y

      - name: Check Rust workspace
        run: cargo check --workspace --all-targets --locked

      - name: Test Rust workspace
        run: cargo test --workspace --locked

      - name: Build WinUI client
        run: dotnet build apps/windows/Sage.Windows/Sage.Windows.csproj -c Release -p:Platform=${{ matrix.platform }}
