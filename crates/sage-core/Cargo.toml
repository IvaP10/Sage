[package]
name = "sage-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = []
qwen35-worker-verification = ["dep:sage-model-package"]
qwen35-worker-load = ["qwen35-worker-verification"]
qwen35-worker-generate = [
    "qwen35-worker-load",
    "dep:sage-qwen-tokenizer",
    "dep:sage-qwen35-runtime",
    "dep:sage-constrained-generation",
]
qwen35-evaluation = ["qwen35-worker-verification", "dep:sage-qwen-tokenizer", "dep:sage-qwen35-runtime", "dep:sage-constrained-generation", "sage-qwen35-runtime/core-test-support", "sage-qwen-tokenizer/core-test-support"]

[lib]
name = "sage_core"
path = "src/lib.rs"

[[bin]]
name = "sage-core"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
async-trait.workspace = true
base64.workspace = true
bytes.workspace = true
chrono.workspace = true
directories.workspace = true
getrandom.workspace = true
hmac.workspace = true
keyring.workspace = true
prost.workspace = true
reqwest.workspace = true
rusqlite.workspace = true
sage-protocol = { path = "../sage-protocol" }
sage-inference-protocol = { path = "../sage-inference-protocol" }
sage-worker-fd = { path = "../sage-worker-fd" }
sage-peer = { path = "../sage-peer" }
sage-model-package = { path = "../sage-model-package", optional = true }
sage-qwen35-runtime = { path = "../sage-qwen35-runtime", optional = true }
sage-constrained-generation = { path = "../sage-constrained-generation", optional = true }
sage-qwen-tokenizer = { path = "../sage-qwen-tokenizer", optional = true }
sage-upnp-av = { path = "../sage-upnp-av" }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
subtle.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true
url.workspace = true
zeroize.workspace = true
notify.workspace = true

cap-std.workspace = true
cap-fs-ext.workspace = true

[dev-dependencies]
ed25519-dalek.workspace = true
tempfile.workspace = true

[target.'cfg(windows)'.dependencies]
# Stable by-handle metadata without Rust's unstable windows_by_handle APIs.
cap-primitives = "=3.4.6"
